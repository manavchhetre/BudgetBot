<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jerry – Create Account</title>
    <meta name="description" content="Create your Jerry account – track expenses with AI in natural language." />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="auth-page">
    <!-- Left: hero image panel -->
    <aside class="auth-hero" aria-label="Jerry introduction">
      <img src="/static/assets/assistant-jerry.jpg" alt="Jerry – Your Finance Assistant" class="hero-img" />
      <div class="hero-overlay"></div>
    </aside>

    <!-- Right: form panel -->
    <main class="auth-form-panel">
      <div class="auth-form-container">
        <div class="auth-logo-row">
          <div class="auth-logo-icon">
            <img src="/static/assets/budget-bot-logo.svg" alt="Jerry" width="36" height="36" />
          </div>
          <strong class="auth-app-name">Jerry</strong>
        </div>

        <h1 id="auth-heading">Create your account</h1>
        <p class="auth-subtitle">Sign up to start tracking with Jerry</p>

        <form class="auth-form" onsubmit="submitAuth(event, 'register')">
          <label class="field" for="reg-name">
            Name
            <input type="text" id="reg-name" name="name" required autocomplete="name" placeholder="Your full name" />
          </label>
          <label class="field" for="reg-email">
            Email
            <input type="email" id="reg-email" name="email" required autocomplete="email" placeholder="name@example.com" />
          </label>
          <label class="field" for="reg-password">
            Password
            <input type="password" id="reg-password" name="password" required minlength="8" autocomplete="new-password" placeholder="••••••••" />
          </label>
          <button class="primary-btn" id="register-submit-btn" type="submit">Create account</button>
          <div class="error" aria-live="polite"></div>
        </form>

        <p class="auth-switch">Already registered? <a class="auth-link" href="/login">Login</a></p>
      </div>
    </main>
    <script src="/static/auth.js"></script>
  </body>
</html>
