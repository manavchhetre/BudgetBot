<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <rect x="50" y="70" width="100" height="90" rx="20" fill="#1a2e44"/>
  <rect x="55" y="75" width="90" height="80" rx="16" fill="#243b55" stroke="#3a5a7c" stroke-width="1"/>
  
  <!-- Head -->
  <rect x="55" y="30" width="90" height="55" rx="18" fill="#1a2e44"/>
  <rect x="60" y="35" width="80" height="45" rx="14" fill="#243b55" stroke="#3a5a7c" stroke-width="1"/>
  
  <!-- Antenna -->
  <line x1="100" y1="30" x2="100" y2="15" stroke="#17b26a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="12" r="5" fill="#17b26a"/>
  
  <!-- Eyes -->
  <circle cx="80" cy="55" r="8" fill="#17b26a"/>
  <circle cx="80" cy="55" r="4" fill="#0e9f5e"/>
  <circle cx="120" cy="55" r="8" fill="#17b26a"/>
  <circle cx="120" cy="55" r="4" fill="#0e9f5e"/>
  
  <!-- Mouth / Smile -->
  <path d="M82 68 Q100 80 118 68" stroke="#17b26a" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Arms -->
  <rect x="30" y="85" width="22" height="12" rx="6" fill="#1a2e44"/>
  <rect x="148" y="85" width="22" height="12" rx="6" fill="#1a2e44"/>
  
  <!-- Screen/chest display -->
  <rect x="70" y="95" width="60" height="30" rx="6" fill="#0d1f33"/>
  <rect x="75" y="100" width="20" height="3" rx="1.5" fill="#17b26a" opacity="0.8"/>
  <rect x="75" y="107" width="30" height="3" rx="1.5" fill="#17b26a" opacity="0.5"/>
  <rect x="75" y="114" width="15" height="3" rx="1.5" fill="#17b26a" opacity="0.3"/>
  
  <!-- Dollar sign floating -->
  <circle cx="160" cy="50" r="14" fill="#17b26a" opacity="0.2"/>
  <text x="160" y="55" text-anchor="middle" fill="#17b26a" font-size="16" font-weight="bold" font-family="sans-serif">$</text>
  
  <!-- Plus signs -->
  <text x="45" y="50" fill="#17b26a" font-size="14" font-weight="bold" opacity="0.4" font-family="sans-serif">+</text>
  <text x="155" y="30" fill="#17b26a" font-size="12" font-weight="bold" opacity="0.3" font-family="sans-serif">+</text>
  <text x="35" y="120" fill="#17b26a" font-size="10" font-weight="bold" opacity="0.3" font-family="sans-serif">+</text>
  
  <!-- Legs -->
  <rect x="70" y="158" width="15" height="18" rx="5" fill="#1a2e44"/>
  <rect x="115" y="158" width="15" height="18" rx="5" fill="#1a2e44"/>
  
  <!-- Feet -->
  <rect x="65" y="172" width="25" height="10" rx="5" fill="#1a2e44"/>
  <rect x="110" y="172" width="25" height="10" rx="5" fill="#1a2e44"/>
</svg>
