<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jerry – Your Finance Assistant</title>
    <meta name="description" content="Sign in to Jerry – your AI-powered finance assistant that tracks expenses through natural conversation." />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="auth-page">
    <!-- Left: hero image panel -->
    <aside class="auth-hero" aria-label="Jerry introduction">
      <img src="/static/assets/assistant-jerry.jpg" alt="Jerry – Your Finance Assistant" class="hero-img" />
      <div class="hero-overlay"></div>
    </aside>

    <!-- Right: form panel -->
    <main class="auth-form-panel">
      <div class="auth-form-container">
        <div class="auth-logo-row">
          <div class="auth-logo-icon">
            <img src="/static/assets/budget-bot-logo.svg" alt="Jerry" width="36" height="36" />
          </div>
          <strong class="auth-app-name">Jerry</strong>
        </div>

        <h1 id="auth-heading">Welcome back!</h1>
        <p class="auth-subtitle">Sign in to continue to Jerry</p>

        <form class="auth-form" onsubmit="submitAuth(event, 'login')">
          <label class="field" for="login-email">
            Email
            <input type="email" id="login-email" name="email" required autocomplete="email" placeholder="name@example.com" />
          </label>
          <div class="field-row">
            <label class="field" for="login-password">
              Password
              <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="••••••••" />
            </label>
            <a class="forgot-link" href="#">Forgot password?</a>
          </div>
          <label class="remember-row">
            <input type="checkbox" name="remember" />
            <span>Remember me</span>
          </label>
          <button class="primary-btn" id="login-submit-btn" type="submit">Login</button>
          <div class="error" aria-live="polite"></div>
        </form>

        <p class="auth-switch">New here? <a class="auth-link" href="/register">Create an account</a></p>
      </div>
    </main>
    <script src="/static/auth.js"></script>
  </body>
</html>
