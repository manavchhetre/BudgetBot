<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Bot – Login</title>
    <meta name="description" content="Sign in to Budget Bot – your AI-powered financial assistant for tracking expenses in natural language." />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="auth-page">
    <aside class="auth-brand-panel" aria-label="Budget Bot branding">
      <div class="auth-brand-top">
        <div class="auth-logo-row">
          <div class="auth-logo-icon">
            <img src="/static/assets/budget-bot-logo.svg" alt="Budget Bot" width="40" height="40" />
          </div>
          <div>
            <strong class="auth-app-name">Budget Bot</strong>
            <span class="auth-app-tagline">Your AI-powered financial assistant</span>
          </div>
        </div>
        <ul class="auth-features">
          <li><span class="feature-dot"></span> Track expenses in natural language</li>
          <li><span class="feature-dot"></span> Get smart insights and analytics</li>
          <li><span class="feature-dot"></span> Stay on top of your budget</li>
          <li><span class="feature-dot"></span> Secure and private</li>
        </ul>
      </div>
      <div class="auth-mascot-wrap">
        <img src="/static/assets/robot-mascot.svg" alt="Budget Bot mascot" class="auth-mascot" />
      </div>
    </aside>

    <main class="auth-form-panel">
      <div class="auth-form-container">
        <h1 id="auth-heading">Welcome back!</h1>
        <p class="auth-subtitle">Sign in to continue to Budget Bot</p>

        <form class="auth-form" onsubmit="submitAuth(event, 'login')">
          <label class="field" for="login-email">
            Email
            <input type="email" id="login-email" name="email" required autocomplete="email" placeholder="name@example.com" />
          </label>
          <div class="field-row">
            <label class="field" for="login-password">
              Password
              <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="••••••••" />
            </label>
            <a class="forgot-link" href="#">Forgot password?</a>
          </div>
          <label class="remember-row">
            <input type="checkbox" name="remember" />
            <span>Remember me</span>
          </label>
          <button class="primary-btn" id="login-submit-btn" type="submit">Login</button>
          <div class="error" aria-live="polite"></div>
        </form>

        <p class="auth-switch">New here? <a class="auth-link" href="/register">Create an account</a></p>
      </div>
    </main>
    <script src="/static/auth.js"></script>
  </body>
</html>
